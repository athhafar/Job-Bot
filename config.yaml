# ============================================================
# Mobile Job Opportunity Bot - Meta Threads Configuration
# ============================================================

settings:
  # Batas maksimal panggilan ke Gemini API per eksekusi
  max_gemini_calls_per_run: 10

  # Ambang batas skor relevansi Gemini (1-10) untuk dikirim ke Telegram
  relevance_threshold: 6

  # Hanya memproses postingan Threads dalam X jam terakhir
  max_post_age_hours: 24

  # Jumlah maksimal ID yang disimpan di seen.json untuk mencegah file membesar
  max_seen_items: 5000

  # Timeout HTTP request dalam detik
  request_timeout_seconds: 15

  # Jeda minimal pengiriman notifikasi error sistem umum ke Telegram (dalam menit)
  error_notify_cooldown_minutes: 60

# Sumber Data: Meta Threads API Resmi (Tanpa Scraping)
sources:
  threads:
    enabled: true
    # Jeda antar request keyword (detik) untuk mencegah rate-limit
    rate_limit_delay_seconds: 1.5

    # Batas total request ke Threads API per run
    max_requests_per_run: 10

    # Batas halaman pagination per keyword
    max_pages_per_keyword: 2

    # Opsional: username akun Threads sendiri agar postingan sendiri diabaikan (tanpa tanda @)
    own_username: ""

    # Daftar keyword pencarian di Threads API
    keywords:
      - "flutter developer"
      - "kotlin android"
      - "react native developer"
      - "mobile developer"
      - "cari developer mobile"
      - "butuh programmer flutter"
      - "lowongan flutter"
      - "lowongan android"
      - "freelance flutter"
      - "hiring flutter"

keywords:
  # Wajib ada minimal satu kata kunci mobile (pencocokan kata utuh \b)
  include:
    - "flutter"
    - "kotlin"
    - "android developer"
    - "react native"
    - "mobile developer"
    - "mobile engineer"
    - "dart"
    - "expo"

  # Wajib ada minimal satu sinyal peluang kerja spesifik (kata utuh \b)
  # Catatan: 'remote' dan 'opportunity' sengaja tidak dimasukkan agar tidak meloloskan diskusi umum
  hiring:
    - "hiring"
    - "dicari"
    - "lowongan"
    - "butuh"
    - "need"
    - "looking for"
    - "freelance"
    - "kontrak"
    - "open position"
    - "kirim cv"
    - "dm"

  # Kata kunci pengecualian (pencari kerja, unpaid, magang) yang langsung ditolak
  exclude:
    - "open to work"
    - "available for hire"
    - "cari kerja"
    - "looking for a job"
    - "for hire"
    - "[for hire]"
    - "unpaid"
    - "magang"
    - "internship"
    - "volunteer"
    - "portfolio review"

# Template balasan statis (digunakan jika Gemini mengalami error/kuota habis)
# Catatan: Jika digunakan, pesan Telegram berlabel '⚠️ Tanpa penilaian AI' dan TIDAK dimasukkan ke seen.json
fallback_templates:
  comment_draft: >
    Halo! Saya mobile developer dengan spesialisasi Flutter, Android Kotlin, dan React Native.
    Tertarik mendiskusikan kebutuhan project ini. Boleh saya hubungi via DM untuk detail & portofolio?
  dm_draft: >
    Halo! Saya melihat postingan lowongan Anda di Threads mengenai kebutuhan Mobile Developer.
    Saya berpengalaman membangun aplikasi mobile multiplatform dan native yang scalable serta siap produksi.
    Berikut portofolio saya: https://github.com/yourusername.
    Kapan waktu yang nyaman untuk mendiskusikan kebutuhan spesifiknya? Terima kasih!
