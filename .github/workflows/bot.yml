name: Job Opportunity Bot (Threads)

on:
  schedule:
    # Berjalan otomatis setiap 30 menit via GitHub Actions (Gratis)
    # Format cron: menit jam hari-bulan bulan hari-minggu (UTC)
    - cron: '*/30 * * * *'
  workflow_dispatch:
    # Trigger manual lewat tab Actions di GitHub UI

# Cegah 2 workflow berjalan bersamaan untuk menghindari race condition pada seen.json
concurrency:
  group: job-opportunity-bot-threads
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run-threads-bot:
    name: Run Meta Threads Mobile Job Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Threads Job Bot
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          THREADS_APP_ID: ${{ secrets.THREADS_APP_ID }}
          THREADS_APP_SECRET: ${{ secrets.THREADS_APP_SECRET }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python main.py

      - name: Commit Updated Seen State
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add seen.json
          # Commit hanya jika ada perubahan pada seen.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen.json [skip ci]"
            git push
            echo "State seen.json updated successfully."
          else
            echo "Tidak ada postingan baru yang diproses, seen.json tidak berubah."
          fi
